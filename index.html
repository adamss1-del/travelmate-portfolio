<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>TravelMate ✈️</h1>
  <p>Your Smart Travel Planning Companion</p>
  <button onclick="toggleTheme()">🌙 Toggle Mode</button>
</header>

<section class="container">

  <!-- LEFT SIDE (PROFILE) -->
  <div class="card">
    <h2>About Me</h2>
    <img src="assets/profile.jpg" alt="Profile">
    <p>I am a web developer passionate about building tools that simplify travel planning. TravelMate combines weather, insights, and tips in one place.</p>

    <h3>Skills</h3>
    <ul id="skills"></ul>
  </div>

  <!-- RIGHT SIDE (APP) -->
  <div class="card">
    <h2>Plan Your Trip 🌍</h2>

    <input type="text" id="city" placeholder="Enter a city">
    <button onclick="getTravelData()">Search</button>

    <div id="results"></div>
  </div>

</section>

<footer>
  <p>© 2026 TravelMate</p>
</footer>

<script src="script.js"></script>
</body>
</html>
